<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <!-- 배경 그라데이션 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>

    <!-- 원격 제어 카드 헤더 (블루/인디고) -->
    <linearGradient id="gRemote" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- PLC 제어 카드 헤더 (에메랄드/그린) -->
    <linearGradient id="gPlc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>

    <!-- 공통 출력 함수 배지 (앰버/오렌지) -->
    <linearGradient id="gOutput" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>

    <!-- 그림자 필터 -->
    <filter id="sh" x="-6%" y="-8%" width="112%" height="122%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.11"/>
    </filter>
    <filter id="shSm" x="-6%" y="-8%" width="112%" height="122%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>

    <!-- 화살표 마커 -->
    <marker id="aBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="aAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- 전체 배경 -->
  <rect width="880" height="440" rx="22" fill="url(#bg)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- ================= 1. 상단: [원격 제어] 있으면 더함 ================= -->
  <g filter="url(#sh)">
    <rect x="40" y="24" width="800" height="146" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <!-- 상단 헤더 바 -->
    <path d="M40 42 Q40 24 58 24 L822 24 Q840 24 840 42 L840 70 L40 70 Z" fill="url(#gRemote)"/>
  </g>

  <!-- 원격 제어 타이틀 & 배지 -->
  <text x="64" y="54" font-size="18.5" font-weight="700" fill="#ffffff">☁️ [원격 제어]  있으면 더함</text>
  <rect x="298" y="34" width="174" height="26" rx="13" fill="#eff6ff" opacity="0.95"/>
  <text x="385" y="52" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">Non-blocking · 비차단</text>
  <text x="816" y="52" text-anchor="end" font-size="13" font-family="Consolas,monospace" font-weight="700" fill="#dbeafe">i2r.link · MQTT · Wi-Fi</text>

  <!-- 원격 제어 내부 3개 블록 -->
  <!-- (1) Wi-Fi 연결 -->
  <g filter="url(#shSm)">
    <rect x="62" y="84" width="228" height="68" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  </g>
  <text x="176" y="111" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e40af">📶 Wi-Fi 연결</text>
  <text x="176" y="134" text-anchor="middle" font-size="12" fill="#475569">기다리지 않고 바로 통과</text>

  <!-- (2) MQTT 명령 받기 / 상태 보내기 -->
  <g filter="url(#shSm)">
    <rect x="308" y="84" width="256" height="68" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  </g>
  <text x="436" y="111" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e40af">📡 MQTT 명령 받기 · 상태 보내기</text>
  <text x="436" y="134" text-anchor="middle" font-size="12" fill="#475569">스마트폰 · PC 실시간 원격 모니터링</text>

  <!-- (3) 끊기면 뒤에서 다시 연결 -->
  <g filter="url(#shSm)">
    <rect x="582" y="84" width="236" height="68" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  </g>
  <text x="700" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">🔄 끊기면 뒤에서 다시 연결</text>
  <text x="700" y="134" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">(PLC 제어는 절대 멈추지 않음)</text>


  <!-- ================= 2. 중앙 연결부: 같은 출력 함수를 부름 ================= -->
  <!-- 중앙 수직 화살표 (원격 제어 -> PLC 제어 출력) -->
  <line x1="440" y1="170" x2="440" y2="246" stroke="#d97706" stroke-width="3.5" stroke-dasharray="6,4" marker-end="url(#aAmber)"/>

  <!-- 중앙 배지 카드 -->
  <g filter="url(#shSm)">
    <rect x="275" y="187" width="330" height="44" rx="22" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <circle cx="302" cy="209" r="13" fill="url(#gOutput)"/>
  <text x="302" y="214" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">▼</text>
  <text x="452" y="214" text-anchor="middle" font-size="14.5" font-weight="700" fill="#b45309">같은 출력 함수를 부름  <tspan font-family="Consolas,monospace" fill="#d97706">plc.output(n, ON)</tspan></text>


  <!-- ================= 3. 하단: [PLC 제어] 항상 동작 ================= -->
  <g filter="url(#sh)">
    <rect x="40" y="254" width="800" height="162" rx="18" fill="#ffffff" stroke="#6ee7b7" stroke-width="2.5"/>
    <!-- 하단 헤더 바 -->
    <path d="M40 272 Q40 254 58 254 L822 254 Q840 254 840 272 L840 300 L40 300 Z" fill="url(#gPlc)"/>
  </g>

  <!-- PLC 제어 타이틀 & 배지 -->
  <text x="64" y="284" font-size="18.5" font-weight="700" fill="#ffffff">⚡ [PLC 제어]  항상 동작</text>
  <rect x="288" y="264" width="220" height="26" rx="13" fill="#ecfdf5" opacity="0.95"/>
  <text x="398" y="282" text-anchor="middle" font-size="12.5" font-weight="700" fill="#047857">Always On · Wi-Fi 없이도 혼자 동작</text>
  <text x="816" y="282" text-anchor="end" font-size="13" font-family="Consolas,monospace" font-weight="700" fill="#d1fae5">loop() 매번 즉시 실행</text>

  <!-- PLC 제어 흐름: 입력 읽기 -> 타이머, 자기유지, 온도 제어 -> 출력 -->
  <!-- 단계 1: 입력 읽기 -->
  <g filter="url(#shSm)">
    <rect x="64" y="318" width="200" height="76" rx="13" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.8"/>
  </g>
  <text x="164" y="348" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46">📥 입력 읽기</text>
  <text x="164" y="370" text-anchor="middle" font-size="12" fill="#047857">접점 · 전압 입력 · 온습도 센서</text>
  <text x="164" y="386" text-anchor="middle" font-size="11" font-family="Consolas,monospace" fill="#059669">plc.input(n) · rising(n)</text>

  <!-- 화살표 1 -> 2 -->
  <line x1="264" y1="356" x2="298" y2="356" stroke="#059669" stroke-width="3" marker-end="url(#aGreen)"/>

  <!-- 단계 2: 타이머, 자기유지, 온도 제어 -->
  <g filter="url(#shSm)">
    <rect x="306" y="318" width="268" height="76" rx="13" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.8"/>
  </g>
  <text x="440" y="348" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46">⚙️ 타이머 · 자기유지 · 온도 제어</text>
  <text x="440" y="370" text-anchor="middle" font-size="12" fill="#047857">TON/TOF · 카운터 · 히스테리시스 판단</text>
  <text x="440" y="386" text-anchor="middle" font-size="11" font-family="Consolas,monospace" fill="#059669">onDelay() · count() · temperature()</text>

  <!-- 화살표 2 -> 3 -->
  <line x1="574" y1="356" x2="608" y2="356" stroke="#059669" stroke-width="3" marker-end="url(#aGreen)"/>

  <!-- 단계 3: 출력 -->
  <g filter="url(#shSm)">
    <rect x="616" y="318" width="200" height="76" rx="13" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <text x="716" y="348" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">🔌 출력 (릴레이)</text>
  <text x="716" y="370" text-anchor="middle" font-size="12" fill="#b45309">현장 제어 · 원격 제어 하나로 통합</text>
  <text x="716" y="386" text-anchor="middle" font-size="11.5" font-family="Consolas,monospace" font-weight="700" fill="#d97706">plc.output(n, ON / OFF)</text>
</svg>
